        new THREE.CanvasTexture(
            labelCanvas
        );

    const label =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                .5,
                .19
            ),
            new THREE.MeshBasicMaterial({
                map:tex,
                transparent:true
            })
        );

    label.position.y =
        .19;

    label.rotation.x=
        -Math.PI/2;

    group.add(label);


    scene.add(group);

    connectors[type] =
        group;
}


for(
    const type in cableColors
){

    createConnector(type);
}


/* =========================================================
   KABLO GÜNCELLE
========================================================= */

function worldPos(object){

    const p=
        new THREE.Vector3();

    object.getWorldPosition(p);

    return p;
}


function updateCable(type){

    const start =
        worldPos(
            sources[type]
        );

    const end =
        connectors[type]
            .position
            .clone();

    const p1 =
        start.clone().lerp(
            end,
            .33
        );

    const p2 =
        start.clone().lerp(
            end,
            .67
        );

    p1.y -= .42;
    p2.y += .15;


    const curve =
        new THREE.CatmullRomCurve3([
            start,
            p1,
            p2,
            end
        ]);


    if(cables[type]){

        scene.remove(
            cables[type]
        );

        cables[type]
            .geometry
            .dispose();

        cables[type]
            .material
            .dispose();
    }


    const geometry=
        new THREE.TubeGeometry(
            curve,
            42,
            .085,
            10,
            false
        );


    const cable=
        new THREE.Mesh(
            geometry,
            new THREE.MeshStandardMaterial({
                color:
                    cableColors[type],
                roughness:.72,
                metalness:.08
            })
        );

    cable.castShadow=true;

    scene.add(cable);

    cables[type]=
        cable;
}


function updateAllCables(){

    for(
        const type in connectors
    ){

        updateCable(type);
    }
}


/* =========================================================
   TUR
========================================================= */

let connected={};
let score=0;


function newRound(){

    currentDevice =
        deviceList[
            Math.floor(
                Math.random()*
                deviceList.length
            )
        ];

    connected={};


    clearDevice();


    switch(
        currentDevice.kind
    ){

        case "phone":
            buildPhone();
            break;

        case "tablet":
            buildTablet();
            break;

        case "laptop":
            buildLaptop();
            break;

        case "watch":
            buildWatch();
            break;

        case "battery":
            buildBattery();
            break;

        case "mouse":
            buildMouse();
            break;

        case "board":
            buildBoard();
            break;
    }


    document.getElementById(
        "deviceName"
    ).textContent =
        currentDevice.name;


    if(
        currentDevice.mode==="charge"
    ){

        document.getElementById(
            "task"
        ).textContent =
            "⚡ B+ ve B− bağla";
    }

    else if(
        currentDevice.mode==="data"
    ){

        document.getElementById(
            "task"
        ).textContent =
            "📁 D+ ve D− bağla";
    }

    else{

        document.getElementById(
            "task"
        ).textContent =
            "⚡📁 B+, B−, D+, D− bağla";
    }


    document.getElementById(
        "message"
    ).textContent =
        "Temas noktaları görünüyor";


    setScreen(
        "HAZIR"
    );


    greenLED.material.color.set(
        0x26372a
    );

    greenLED.material.emissive.set(
        0x003d0a
    );


    for(
        const type in connectors
    ){

        connectors[type]
            .position.copy(
                connectorStart[type]
            );

        connectors[type]
            .userData.connected=false;
    }


    updateAllCables();
}


/* =========================================================
   GEREKLİ
========================================================= */

function required(){

    if(
        currentDevice.mode==="charge"
    ){

        return[
            "Bplus",
            "Bminus"
        ];
    }

    if(
        currentDevice.mode==="data"
    ){

        return[
            "Dplus",
            "Dminus"
        ];
    }

    return[
        "Bplus",
        "Bminus",
        "Dplus",
        "Dminus"
    ];
}


/* =========================================================
   BAĞLANTI
========================================================= */

function checkConnection(type){

    const connector =
        connectors[type];

    const target =
        devicePorts[type];

    if(!target){

        resetConnector(type);
        return;
    }


    const targetWorld =
        worldPos(target);

    const distance =
        connector.position
            .distanceTo(
                targetWorld
            );


    if(distance<1.1){

        connector.position.copy(
            targetWorld
        );

        connector.userData.connected=
            true;

        connected[type]=true;


        target.material.color.set(
            0x27bedc
        );


        document.getElementById(
            "message"
        ).textContent =
            "✓ "+type+" bağlandı";


        updateAllCables();


        const needed =
            required();

        if(
            needed.every(
                t=>connected[t]
            )
        ){

            completeRound();
        }

    }else{

        document.getElementById(
            "message"
        ).textContent =
            "✕ Yanlış temas noktası";

        resetConnector(type);
    }
}


function resetConnector(type){

    connectors[type]
        .position.copy(
            connectorStart[type]
        );

    connectors[type]
        .userData.connected=false;

    updateAllCables();
}


/* =========================================================
   TAMAMLAMA
========================================================= */

function completeRound(){

    score++;

    document.getElementById(
        "score"
    ).textContent =
        score;


    greenLED.material.color.set(
        0x3df260
    );

    greenLED.material.emissive.set(
        0x087b18
    );


    if(
        currentDevice.mode==="charge"
    ){

        setScreen(
            "⚡ ŞARJ"
        );
    }

    else if(
        currentDevice.mode==="data"
    ){

        setScreen(
            "📁 VERİ"
        );
    }

    else{

        setScreen(
            "⚡📁 AKTİF"
        );
    }


    document.getElementById(
        "message"
    ).textContent =
        "🎉 BAĞLANTI TAMAM!";


    setTimeout(
        newRound,
        1600
    );
}


/* =========================================================
   DOKUNMATİK + MOUSE SÜRÜKLEME
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

const dragPlane =
    new THREE.Plane(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        -.05
    );

let dragging=null;

let dragOffset=
    new THREE.Vector3();


renderer.domElement
.addEventListener(
    "pointerdown",
    function(event){

        mouse.x =
            event.clientX /
            window.innerWidth *
            2 - 1;

        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const objects=[];


        for(
            const type in connectors
        ){

            connectors[type]
                .traverse(
                    child=>{

                        if(
                            child.isMesh
                        ){
                            objects.push(
                                child
                            );
                        }
                    }
                );
        }


        const hits=
            raycaster
                .intersectObjects(
                    objects,
                    true
                );


        if(!hits.length)
            return;


        let selected=
            hits[0].object;


        while(
            selected.parent &&
            !selected.userData.type
        ){

            selected=
                selected.parent;
        }


        if(
            !selected.userData.type
        )
            return;


        if(
            selected.userData.connected
        )
            return;


        dragging=
            selected;


        renderer.domElement.setPointerCapture?.(
            event.pointerId
        );


        const hitPoint=
            new THREE.Vector3();


        if(
            raycaster.ray
                .intersectPlane(
                    dragPlane,
                    hitPoint
                )
        ){

            dragOffset.copy(
                dragging.position
            ).sub(
                hitPoint
            );
        }


        event.preventDefault();
    },
    {
        passive:false
    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

window.addEventListener(
    "pointermove",
    function(event){

        if(!dragging)
            return;


        mouse.x =
            event.clientX /
            window.innerWidth *
            2 - 1;

        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const point=
            new THREE.Vector3();


        if(
            raycaster.ray
                .intersectPlane(
                    dragPlane,
                    point
                )
        ){

            dragging.position.copy(
                point
            ).add(
                dragOffset
            );


            dragging.position.y=
                .45;


            updateAllCables();
        }
    },
    {
        passive:false
    }
);


/* =========================================================
   POINTER UP
========================================================= */

window.addEventListener(
    "pointerup",
    function(event){

        if(!dragging)
            return;


        const type=
            dragging.userData.type;


        checkConnection(type);


        dragging=
            null;
    }
);


/* =========================================================
   KAMERA
========================================================= */

let cameraMoving=false;

let cameraX=0;
let cameraY=0;


renderer.domElement
.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


/*
    Orta/sağ boş alandan sürükleyerek
    kamerayı hareket ettir.
*/

renderer.domElement
.addEventListener(
    "pointerdown",
    function(event){

        if(dragging)
            return;

        if(event.button===0){

            cameraMoving=true;

            cameraX=
                event.clientX;

            cameraY=
                event.clientY;
        }
    }
);


window.addEventListener(
    "pointermove",
    function(event){

        if(
            !cameraMoving ||
            dragging
        )
            return;


        const dx=
            event.clientX-cameraX;

        const dy=
            event.clientY-cameraY;


        cameraX=
            event.clientX;

        cameraY=
            event.clientY;


        const angle=
            Math.atan2(
                camera.position.x,
                camera.position.z
            );


        const radius=
            Math.hypot(
                camera.position.x,
                camera.position.z
            );


        const newAngle=
            angle-dx*.005;


        camera.position.x=
            Math.sin(
                newAngle
            )*radius;

        camera.position.z=
            Math.cos(
                newAngle
            )*radius;


        camera.position.y+=
            dy*.025;


        camera.position.y=
            Math.max(
                3,
                Math.min(
                    11,
                    camera.position.y
                )
            );


        camera.lookAt(
            0,
            1,
            0
        );
    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        cameraMoving=false;
    }
);


/* =========================================================
   ZOOM
========================================================= */

renderer.domElement
.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();

        const dir=
            camera.position
            .clone()
            .normalize();


        camera.position.add(
            dir.multiplyScalar(
                event.deltaY*.003
            )
        );


        const distance=
            camera.position.length();


        if(distance<7)
            camera.position.setLength(7);

        if(distance>20)
            camera.position.setLength(20);


        camera.lookAt(
            0,
            1,
            0
        );
    },
    {
        passive:false
    }
);


/* =========================================================
   YENİ TUR
========================================================= */

document.getElementById(
    "newRound"
)
.addEventListener(
    "click",
    function(){

        score=0;

        document.getElementById(
            "score"
        ).textContent="0";

        newRound();
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

   BAŞLAT
========================================================= */

setScreen(
    "HAZIR"
);

newRound();

document.getElementById(
    "loading"
).style.display="none";


/* =========================================================
   ANİMASYON
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
