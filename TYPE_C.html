let currentDevice=null;

function clearDevice(){

    while(device.children.length){

        const object=
            device.children[
                device.children.length-1
            ];

        device.remove(
            object
        );

        if(object.geometry)
            object.geometry.dispose();

        if(object.material)
            object.material.dispose();
    }

    devicePorts.Bplus=null;
    devicePorts.Bminus=null;
    devicePorts.Dplus=null;
    devicePorts.Dminus=null;
}


/* Genel cihaz parçaları */

function makeBody(
    width,
    height,
    depth,
    color,
    radius=0
){

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            new THREE.MeshStandardMaterial({
                color,
                roughness:.38,
                metalness:.42
            })
        );

    body.castShadow=true;
    body.receiveShadow=true;

    if(radius)
        body.geometry.translate(
            0,0,0
        );

    device.add(body);

    return body;
}

function createConnector(type){

    const group=
        new THREE.Group();

    group.position.copy(
        connectorPositions[type]
    );

    group.userData.type=
        type;

    group.userData.connected=
        false;

    const housing=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                .32,
                .45
            ),
            new THREE.MeshStandardMaterial({
                color:
                    cableColors[type],
                roughness:.38,
                metalness:.18
            })
        );

    housing.castShadow=true;

    group.add(housing);


    const metal=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .30,
                .18,
                .42
            ),
            new THREE.MeshStandardMaterial({
                color:0xb7babd,
                metalness:.95,
                roughness:.12
            })
        );

    metal.position.z=
        -.38;

    group.add(metal);

    scene.add(group);

    connectors[type]=
        group;
}


for(
    const type in cableColors
){

    createConnector(type);
}


/* Kablo oluştur */

function updateCable(type){

    const start=
        getWorldPosition(
            connectionPads[type]
        );

    const end=
        connectors[type]
            .position.clone();

    const p1=
        start.clone().lerp(
            end,
            .33
        );

    const p2=
        start.clone().lerp(
            end,
            .66
        );

    p1.y-=.45;
    p2.y+=.12;

    const curve=
        new THREE.CatmullRomCurve3([
            start,
            p1,
            p2,
            end
        ]);

    if(cables[type]){

        scene.remove(
            cables[type]
        );

        cables[type]
            .geometry
            .dispose();

        cables[type]
            .material
            .dispose();
    }

    const tube=
        new THREE.TubeGeometry(
            curve,
            40,
            .085,
            10,
            false
        );

    const mesh=
        new THREE.Mesh(
            tube,
            new THREE.MeshStandardMaterial({
                color:
                    cableColors[type],
                roughness:.72,
                metalness:.05
            })
        );

    mesh.castShadow=true;

    scene.add(mesh);

    cables[type]=mesh;
}


function updateAllCables(){

    for(
        const type in connectors
    ){

        updateCable(
            type
        );
    }
}


/* =====================================================
   DÜNYA POZİSYONU
===================================================== */

function getWorldPosition(
    object
){

    const p=
        new THREE.Vector3();

    object.getWorldPosition(
        p
    );

    return p;
}

   YENİ TUR

let score=0;
let connected={};

function newRound(){

    currentDevice=
        deviceList[
            Math.floor(
                Math.random()*
                deviceList.length
            )
        ];

    connected={};

    clearDevice();

    switch(
        currentDevice.kind
    ){

        case "phone":
            buildPhone();
            break;

        case "tablet":
            buildTablet();
            break;

        case "laptop":
            buildLaptop();
            break;

        case "watch":
            buildWatch();
            break;

        case "battery":
            buildBattery();
            break;

        case "mouse":
            buildMouse();
            break;

        case "motherboard":
            buildMotherboard();
            break;
    }


    document.getElementById(
        "deviceName"
    ).textContent=
        currentDevice.name;


    if(
        currentDevice.mode==="charge"
    ){

        document.getElementById(
            "task"
        ).textContent=
            "⚡ B+ ve B− bağla";
    }
    else if(
        currentDevice.mode==="data"
    ){

        document.getElementById(
            "task"
        ).textContent=
            "📁 D+ ve D− bağla";
    }
    else{

        document.getElementById(
            "task"
        ).textContent=
            "⚡📁 B+, B−, D+, D− bağla";
    }


    document.getElementById(
        "message"
    ).textContent=
        "Kablo uçlarını doğru temas noktasına tak";


    setDisplay(
        "HAZIR"
    );


    greenLED.material.color.set(
        0x253529
    );

    greenLED.material.emissive.set(
        0x003b0b
    );


    for(
        const type in connectors
    ){

        connectors[type]
            .position.copy(
                connectorPositions[type]
            );

        connectors[type]
            .userData.connected=
            false;
    }


    for(
        const type in devicePorts
    ){

        if(devicePorts[type]){

            devicePorts[type]
                .material
                .color
                .set(0x565b60);
        }
    }


    updateAllCables();
}

setDisplay(

/* =====================================================
   BAĞLANTI KONTROL
===================================================== */

function getRequired(){

    if(
        currentDevice.mode===
        "charge"
    ){

        return[
            "Bplus",
            "Bminus"
        ];
    }

    if(
        currentDevice.mode===
        "data"
    ){

        return[
            "Dplus",
            "Dminus"
        ];
    }

    return[
        "Bplus",
        "Bminus",
        "Dplus",
        "Dminus"
    ];
}


function checkConnection(
    type
){

    const connector=
        connectors[type];

    const target=
        devicePorts[type];

    if(!target){

        resetConnector(type);
        return;
    }

    const targetPosition=
        getWorldPosition(
            target
        );

    const distance=
        connector.position
        .distanceTo(
            targetPosition
        );


    if(
        distance<1.05
    ){

        connector.position.copy(
            targetPosition
        );

        connector.userData.connected=
            true;

        connected[type]=
            true;

        target.material.color.set(
            0x29bddb
        );


        document.getElementById(
            "message"
        ).textContent=
            "✓ "+type+
            " bağlantısı tamam";


        updateAllCables();

        checkComplete();

    }
    else{

        document.getElementById(
            "message"
        ).textContent=
            "✕ Yanlış temas noktası";

        resetConnector(type);
    }
}


/* =====================================================
   SIFIRLAMA
===================================================== */

function resetConnector(
    type
){

    connectors[type]
        .position.copy(
            connectorPositions[type]
        );

    connectors[type]
        .userData.connected=
            false;

    updateAllCables();
}


/* =====================================================
   TAMAMLAMA
===================================================== */

function checkComplete(){

    const needed=
        getRequired();

    if(
        !needed.every(
            type=>connected[type]
        )
    )
        return;


    score++;

    document.getElementById(
        "score"
    ).textContent=
        score;


    greenLED.material.color.set(
        0x3df060
    );

    greenLED.material.emissive.set(
        0x0b7d1a
    );


    if(
        currentDevice.mode===
        "charge"
    ){

        setDisplay(
            "⚡ ŞARJ"
        );
    }

    else if(
        currentDevice.mode===
        "data"
    ){

        setDisplay(
            "📁 VERİ"
        );
    }

    else{

        setDisplay(
            "⚡📁 AKTİF"
        );
    }


    document.getElementById(
        "message"
    ).textContent=
        "🎉 DEVRE TAMAMLANDI!";


    setTimeout(
        newRound,
        1600
    );
}


/* =====================================================
   KABLO SÜRÜKLEME
===================================================== */

const raycaster=
    new THREE.Raycaster();

const mouse=
    new THREE.Vector2();

const dragPlane=
    new THREE.Plane(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        -.1
    );

let dragging=null;

let dragOffset=
    new THREE.Vector3();


renderer.domElement
.addEventListener(
    "pointerdown",
    event=>{

        mouse.x=
            event.clientX/
            window.innerWidth*
            2-1;

        mouse.y=
            -(event.clientY/
            window.innerHeight)*
            2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );


        const objects=[];

        for(
            const type in connectors
        ){

            connectors[type]
                .traverse(
                    child=>{

                        if(
                            child.isMesh
                        ){

                            objects.push(
                                child
                            );
                        }
                    }
                );
        }


        const hits=
            raycaster
            .intersectObjects(
                objects,
                true
            );


        if(!hits.length)
            return;


        let selected=
            hits[0].object;


        while(
            selected.parent &&
            !selected.userData.type
        ){

            selected=
                selected.parent;
        }


        if(
            !selected.userData.type
        )
            return;


        if(
            selected.userData.connected
        )
            return;


        dragging=
            selected;


        const point=
            new THREE.Vector3();


        if(
            raycaster.ray
            .intersectPlane(
                dragPlane,
                point
            )
        ){

            dragOffset.copy(
                dragging.position
            ).sub(
                point
            );
        }
    }
);


/* hareket */

window.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;


        mouse.x=
            event.clientX/
            window.innerWidth*
            2-1;

        mouse.y=
            -(event.clientY/
            window.innerHeight)*
            2+1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const point=
            new THREE.Vector3();


        if(
            raycaster.ray
            .intersectPlane(
                dragPlane,
                point
            )
        ){

            dragging.position
                .copy(
                    point
                )
                .add(
                    dragOffset
                );

            dragging.position.y=
                .45;

            updateAllCables();
        }
    }
);


/* bırak */

window.addEventListener(
    "pointerup",
    ()=>{

        if(!dragging)
            return;


        const type=
            dragging.userData.type;


        checkConnection(
            type
        );


        dragging=null;
    }
);


/* =====================================================
   KAMERA
===================================================== */

let rotating=false;

let oldX=0;
let oldY=0;

renderer.domElement
.addEventListener(
    "pointerdown",
    event=>{

        if(dragging)
            return;

        rotating=true;

        oldX=event.clientX;
        oldY=event.clientY;
    }
);


window.addEventListener(
    "pointermove",
    event=>{

        if(
            !rotating ||
            dragging
        )
            return;


        const dx=
            event.clientX-oldX;

        const dy=
            event.clientY-oldY;


        oldX=event.clientX;
        oldY=event.clientY;


        const angle=
            Math.atan2(
                camera.position.x,
                camera.position.z
            );

        const radius=
            Math.hypot(
                camera.position.x,
                camera.position.z
            );


        const newAngle=
            angle-dx*.006;


        camera.position.x=
            Math.sin(
                newAngle
            )*radius;


        camera.position.z=
            Math.cos(
                newAngle
            )*radius;


        camera.position.y+=
            dy*.025;


        camera.position.y=
            Math.max(
                3,
                Math.min(
                    11,
                    camera.position.y
                )
            );


        camera.lookAt(
            0,
            1,
            0
        );
    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        rotating=false;
    }
);


/* =====================================================
   ZOOM
===================================================== */

renderer.domElement
.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();

        const dir=
            camera.position
            .clone()
            .normalize();

        camera.position.add(
            dir.multiplyScalar(
                event.deltaY*.004
            )
        );


        const distance=
            camera.position.length();


        if(distance<7)
            camera.position
                .setLength(7);

        if(distance>20)
            camera.position
                .setLength(20);


        camera.lookAt(
            0,
            1,
            0
        );
    },
    {
        passive:false
    }
);
